<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Autocenter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="dashboard"></div>

    <input type="date" id="dataInicial">
<input type="date" id="dataFinal">
<button id="filtrar">Filtrar serviços</button>

    <div class="container">

        <div class="novo-atendimento">

            <h1>Novo Atendimento</h1>

            <input type="text" id="nome" placeholder="Nome">
            <input type="tel" id="wpp" maxlength="11" placeholder="54999999999">
            <input type="text" id="placa" placeholder="Placa">
            <input type="text" id="marca" placeholder="Marca">
            <input type="text" id="modelo" placeholder="Modelo">
            <input type="number" id="ano" placeholder="Ano">
            <input type="text" id="servico" placeholder="Serviço">
            <input type="number" id="valor" placeholder="Valor">
            <input type="number" id="km" placeholder="KM">
            <input type="date" id="data" placeholder="Data">

            <button id="salvar">
                Salvar
            </button>

            <div id="mensagem"></div>

        </div>

        <div class="historico">

            <h1>Histórico Veículo</h1>

            <input
                type="text"
                id="placaBusca"
                placeholder="Digite a placa"
            >

            <button id="buscar">
                Buscar
            </button>

            <div id="resultado"></div>

            <input 
            type="text"
            id="nomeBusca"
            placeholder="Digite o nome"
            >

<button id="buscarNome">
    Buscar
    </button>

<div id="resultadoNome"></div>

<h2>Clientes Inativos</h2>

<button id="buscarInativos">
    Buscar Clientes Inativos
</button>

<div id="resultadoInativos"></div>

        </div>

        

    </div>

    

    <script src="cadastro.js"></script>
    <script src="historico.js"></script>
    <script src="dashboard.js"></script>

</body>
</html>
